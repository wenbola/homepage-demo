<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>陈文斌 · 个人主页</title>
<style>
  :root {
    --bg: #eaedf2;        /* 页面底色：浅灰，避免全白一片 */
    --surface: #ffffff;   /* 卡片底色 */
    --fg: #0b1220;        /* 标题：近黑深蓝 */
    --body: #1e293b;      /* 正文：加深 */
    --muted: #475569;     /* 区块标签：加深 */
    --line: #cbd5e1;      /* 分隔线 / 描边：明显加深 */
    --accent: #1e3a8a;    /* 主色调：深蓝 */
    --chip-bg: #e2e8f0;
    --radius: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d12;
      --surface: #14171e;
      --fg: #f1f5f9;
      --body: #cbd5e1;
      --muted: #94a3b8;
      --line: #313847;
      --accent: #4c6ef5;
      --chip-bg: #1e242e;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--body);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.78;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 5.5rem 1.5rem 5rem;
  }

  /* ---------- 头部 ---------- */
  .hero {
    display: flex;
    align-items: center;
    gap: 1.25rem;
  }

  .avatar {
    flex: none;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--accent);
    color: #ffffff;
    display: grid;
    place-items: center;
    font-size: 1.625rem;
    font-weight: 600;
    line-height: 1;
    user-select: none;
  }

  .hero h1 {
    margin: 0;
    font-size: clamp(1.875rem, 6vw, 2.375rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--fg);
  }

  .hero .identity {
    margin: 0.375rem 0 0;
    font-size: 1rem;
    color: var(--muted);
  }

  /* ---------- 区块 ---------- */
  section { margin-top: 3.25rem; }

  h2 {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin: 0 0 1.375rem;
    font-size: 0.8125rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--accent);
  }

  h2::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  /* ---------- 个人简介 ---------- */
  .bio {
    margin: 0;
    font-size: 1.0313rem;
    line-height: 1.85;
    color: var(--body);
  }

  .bio::before {
    content: "";
    display: block;
    width: 2rem;
    height: 3px;
    border-radius: 2px;
    background: var(--accent);
    margin-bottom: 1.25rem;
  }

  /* ---------- 兴趣方向 ---------- */
  .interests {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 0.75rem;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .interests li {
    padding: 1rem 1.125rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
    font-size: 0.9688rem;
    font-weight: 600;
    color: var(--fg);
    transition: border-color 0.18s, box-shadow 0.18s, transform 0.18s;
  }

  .interests li:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 14px rgba(30, 58, 138, 0.14);
    transform: translateY(-2px);
  }

  /* ---------- 技能标签 ---------- */
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .tags li {
    padding: 0.3125rem 0.875rem;
    background: var(--chip-bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 0.9063rem;
    font-weight: 500;
    line-height: 1.6;
    color: var(--fg);
  }

  /* ---------- 联系方式 ---------- */
  .contact a {
    color: var(--accent);
    font-size: 1rem;
    font-weight: 500;
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 1px;
    transition: border-color 0.15s;
  }

  .contact a:hover { border-bottom-color: var(--accent); }
</style>
</head>
<body>
  <div class="container">

    <header class="hero">
      <div class="avatar">陈</div>
      <div>
        <h1>陈文斌</h1>
        <p class="identity">复旦大学 · 金融硕士在读</p>
      </div>
    </header>

    <main>

      <section id="about">
        <h2>个人简介</h2>
        <p class="bio">
          关注金融市场与量化策略，正在学习数据分析和编程工具，希望把技术应用到投资研究中。
        </p>
      </section>

      <section id="interests">
        <h2>兴趣方向</h2>
        <ul class="interests">
          <li>量化交易</li>
          <li>金融数据分析</li>
          <li>Python 编程</li>
        </ul>
      </section>

      <section id="skills">
        <h2>技能标签</h2>
        <ul class="tags">
          <li>Python</li>
          <li>Excel</li>
          <li>数据分析</li>
          <li>CPA 在考</li>
        </ul>
      </section>

      <section id="contact">
        <h2>联系方式</h2>
        <p class="contact">
          <a href="mailto:26210680010@m.fudan.edu.cn">26210680010@m.fudan.edu.cn</a>
        </p>
      </section>

    </main>

  </div>
</body>
</html>
