<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle Trail</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  body {
    touch-action: none;   /* 防止触屏拖动时页面滚动干扰 */
    cursor: crosshair;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: block;
  }

  /* 中央文字层：pointer-events 必须关掉，否则会挡住鼠标事件 */
  .hint {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
    z-index: 1;
  }

  /* 两条消息叠在同一个网格单元里，原地交叉淡入淡出 */
  .msg {
    grid-area: 1 / 1;
    perspective: 800px;
    opacity: 0;
    transform: scale(0.94);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .msg.is-in {
    opacity: 1;
    transform: scale(1);
  }

  /* 倾斜由 JS 逐帧写在内层 span 上，外层 .msg 只管透明度 ——
     两者分开，逐帧的 transform 才不会和 CSS transition 打架 */
  .msg > span {
    display: block;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: clamp(1.5rem, 4.5vw, 2.75rem);
    font-weight: 200;
    letter-spacing: 0.22em;
    text-indent: 0.22em;      /* 补偿末位字母的字距，使视觉居中 */
    white-space: nowrap;
    color: #fff;
    text-shadow:
      0 0 16px rgba(255, 255, 255, 0.5),
      0 0 48px rgba(130, 160, 255, 0.45);
    transform-style: preserve-3d;
    will-change: transform;
  }

  /* 欢迎词：中文字距收紧、字号放大、辉光加强 */
  #hello > span {
    font-size: clamp(2.5rem, 9vw, 4.5rem);
    font-weight: 300;
    letter-spacing: 0.08em;
    text-indent: 0.08em;
    text-shadow:
      0 0 20px rgba(255, 255, 255, 0.6),
      0 0 60px rgba(130, 160, 255, 0.5);
  }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="hint">
    <div class="msg is-in" id="hello"><span>你好</span></div>
    <div class="msg" id="hint"><span>Move your mouse</span></div>
  </div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('stage');
  // alpha:false —— 省掉每帧的透明合成，且 fillRect 即为纯黑背景
  var ctx = canvas.getContext('2d', { alpha: false });

  var helloMsg = document.getElementById('hello');
  var hintMsg = document.getElementById('hint');
  // 倾斜作用在内层 span 上（外层 .msg 的 transform 归 CSS transition 管）
  var tilts = [helloMsg.firstElementChild, hintMsg.firstElementChild];

  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);   // 上限 2，避免 4K 屏下像素量爆炸
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }

  /* ------------------------------------------------------------------
     发光精灵：预渲染 18 个色相的径向渐变圆。运行时只做 drawImage，
     完全不碰 shadowBlur —— 后者在粒子数量上千时会把帧率拖垮。
     ------------------------------------------------------------------ */
  var HUE_BUCKETS = 18;
  var SPRITE = 64;
  var sprites = [];

  (function buildSprites() {
    for (var i = 0; i < HUE_BUCKETS; i++) {
      var hue = Math.round(i * 360 / HUE_BUCKETS);
      var c = document.createElement('canvas');
      c.width = c.height = SPRITE;
      var g = c.getContext('2d');
      var grad = g.createRadialGradient(SPRITE / 2, SPRITE / 2, 0, SPRITE / 2, SPRITE / 2, SPRITE / 2);
      grad.addColorStop(0.00, 'hsla(' + hue + ', 100%, 80%, 1)');
      grad.addColorStop(0.18, 'hsla(' + hue + ', 100%, 62%, 0.75)');
      grad.addColorStop(0.45, 'hsla(' + hue + ', 100%, 52%, 0.20)');
      grad.addColorStop(1.00, 'hsla(' + hue + ', 100%, 50%, 0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, SPRITE, SPRITE);
      sprites.push(c);
    }
  })();

  function randBucket() {
    return (Math.random() * HUE_BUCKETS) | 0;
  }

  /* ------------------------------------------------------------------
     粒子池：固定容量 + 环形复用（O(1)），运行期零分配，不触发 GC 抖动。
     ------------------------------------------------------------------ */
  var MAX = 1400;
  var pool = new Array(MAX);
  for (var k = 0; k < MAX; k++) {
    pool[k] = { x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 1, size: 0, sprite: sprites[0] };
  }
  var head = 0;

  function emit(x, y, vx, vy, life, size) {
    var p = pool[head];
    head = (head + 1) % MAX;
    p.x = x; p.y = y;
    p.vx = vx; p.vy = vy;
    p.life = life; p.maxLife = life;
    p.size = size;
    p.sprite = sprites[randBucket()];
    return p;
  }

  /* ---------------- 鼠标移动：沿线插值发射拖尾 ---------------- */
  var lastX = null, lastY = null, lastT = 0;

  function spawnTrail(x, y, t) {
    // 停顿超过 120ms 或首次进入，重置起点，避免拉出一条横穿屏幕的直线
    if (lastX === null || t - lastT > 120) {
      lastX = x; lastY = y; lastT = t;
      return;
    }

    var dx = x - lastX, dy = y - lastY;
    var ox = lastX, oy = lastY;
    var dist = Math.hypot(dx, dy);
    lastX = x; lastY = y; lastT = t;

    // 按距离插值，快速甩动时轨迹不会断裂
    var steps = Math.min(Math.max(Math.ceil(dist / 6), 1), 24);

    for (var i = 1; i <= steps; i++) {
      var f = i / steps;
      emit(
        ox + dx * f,
        oy + dy * f,
        (Math.random() - 0.5) * 1.3,
        (Math.random() - 0.5) * 1.3 - 0.18,   // 略微上飘
        42 + Math.random() * 48,
        4 + Math.random() * 6
      );
    }
  }

  /* ---------------- 点击：环形爆发 ---------------- */
  function burst(x, y) {
    var n = 64;
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.12;
      var sp = 3 + Math.random() * 11;   // 速度跨度拉大，爆环才散得开
      emit(x, y, Math.cos(a) * sp, Math.sin(a) * sp,
           52 + Math.random() * 46,
           4 + Math.random() * 7);
    }
    // 中心高亮核心
    for (var j = 0; j < 14; j++) {
      var a2 = Math.random() * Math.PI * 2;
      var sp2 = Math.random() * 2.2;
      emit(x, y, Math.cos(a2) * sp2, Math.sin(a2) * sp2,
           22 + Math.random() * 22,
           7 + Math.random() * 7);
    }
  }

  /* ---------------- 中央文字：跟随鼠标轻微倾斜 ---------------- */
  var mx = 0, my = 0;                             // 归一化到 -1..1
  var rx = 0, ry = 0, rot = 0, tx = 0, ty = 0;    // 当前值（全部缓动，务必保持一致）

  function updateHint(delta) {
    var ease = 1 - Math.pow(0.90, delta);   // 帧率无关的缓动系数
    rx  += (-my * 12 - rx)  * ease;
    ry  += (mx * 16 - ry)   * ease;
    rot += (mx * 2 - rot)   * ease;
    tx  += (mx * 12 - tx)   * ease;
    ty  += (my * 7 - ty)    * ease;

    // 3D 透视转向 + 少量 2D 旋转：后者让"倾斜"在静止画面上也看得出来，
    // 只有 rotateX/rotateY 时视觉上更像横向压缩
    var tf =
      'translate3d(' + tx.toFixed(2) + 'px,' + ty.toFixed(2) + 'px,0) ' +
      'rotate(' + rot.toFixed(2) + 'deg) ' +
      'rotateX(' + rx.toFixed(2) + 'deg) ' +
      'rotateY(' + ry.toFixed(2) + 'deg)';

    tilts[0].style.transform = tf;
    tilts[1].style.transform = tf;
  }

  /* ---------------- 主循环 ---------------- */
  var DRAG = 0.945;
  var prev = performance.now();
  var raf = 0;

  function frame(now) {
    var delta = Math.min((now - prev) / 16.667, 3);   // 归一化到 60fps 步长，并钳制卡顿
    prev = now;
    var drag = Math.pow(DRAG, delta);

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';         // 叠加发光

    for (var i = 0; i < MAX; i++) {
      var p = pool[i];
      if (p.life <= 0) continue;

      p.life -= delta;
      if (p.life <= 0) continue;

      p.vx *= drag;
      p.vy *= drag;
      p.x += p.vx * delta;
      p.y += p.vy * delta;

      var t = p.life / p.maxLife;                     // 1 → 0
      ctx.globalAlpha = t * t * (3 - 2 * t);          // smoothstep 淡出
      var s = p.size * (0.4 + 0.6 * t) * 3;           // 随寿命收缩

      ctx.drawImage(p.sprite, p.x - s / 2, p.y - s / 2, s, s);
    }

    ctx.globalAlpha = 1;
    updateHint(delta);

    raf = requestAnimationFrame(frame);
  }

  /* ---------------- 事件绑定 ---------------- */
  window.addEventListener('pointermove', function (e) {
    mx = (e.clientX / W) * 2 - 1;
    my = (e.clientY / H) * 2 - 1;
    spawnTrail(e.clientX, e.clientY, e.timeStamp);
  }, { passive: true });

  window.addEventListener('pointerdown', function (e) {
    burst(e.clientX, e.clientY);
  }, { passive: true });

  window.addEventListener('resize', resize);

  // 切到后台时停掉 rAF，省电
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      cancelAnimationFrame(raf);
      raf = 0;
    } else if (!raf) {
      prev = performance.now();
      raf = requestAnimationFrame(frame);
    }
  });

  /* ---------------- 进场：先亮出欢迎词，再换成操作提示 ----------------
     顺序切换而非交叉淡化：两句文字宽高差很多，叠在一起会互相透出来。 */
  var WELCOME_MS = 1500;   // 欢迎词停留时长
  var FADE_MS = 400;       // 单次淡入/淡出时长，需与上面的 CSS transition 一致

  setTimeout(function () {
    helloMsg.classList.remove('is-in');
    setTimeout(function () {
      hintMsg.classList.add('is-in');
    }, FADE_MS);           // 等欢迎词完全消失后再亮提示
  }, WELCOME_MS);

  resize();
  raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
